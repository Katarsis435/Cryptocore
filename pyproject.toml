[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "0.1.0"
description = "AES-128 ECB CLI tool (Sprint 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pycryptodome>=3.20.0",
]

[project.scripts]
cryptocore = "src.cli_parser:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]